name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package registry
        run: |
          set -euo pipefail
          mkdir -p dist/registry
          rsync -a --exclude .git --exclude dist ./ dist/registry/
          tar -czf dist/registry.tar.gz -C dist registry
          cd dist
          sha256sum registry.tar.gz > registry.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/registry.tar.gz \
            dist/registry.sha256 \
            --title "smokeforge-registry $GITHUB_REF_NAME" \
            --notes "Adds the Rust/Axum backend with SQLx/Postgres, JWT auth, Docker, CI, and five Rust skills. Go/Gin backends retain Postgres, JWT auth, TOTP, Redis cache, RabbitMQ worker/scheduler, scheduler leadership, dedupe, gzip, authenticated image media with MinIO/imgproxy/nginx or Cloudflare R2, Meilisearch search, RabbitMQ search index sync, signed cursor/offset pagination, Docker, CI, Swagger, embedded migrations, and project-scoped Go skills."
