name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package registry
        run: |
          set -euo pipefail
          mkdir -p dist/registry
          rsync -a --exclude .git --exclude dist ./ dist/registry/
          tar -czf dist/registry.tar.gz -C dist registry
          cd dist
          sha256sum registry.tar.gz > registry.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            Registry release with fullstack desktop, offline Library sync,
            versioned idempotent APIs, manual conflicts, and retry/changefeed
            support.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "smokeforge-registry $GITHUB_REF_NAME" \
                 --notes "$NOTES"
          gh release upload "$GITHUB_REF_NAME" \
            dist/registry.tar.gz dist/registry.sha256 --clobber
          gh release edit "$GITHUB_REF_NAME" --title "smokeforge-registry $GITHUB_REF_NAME" --notes "$NOTES"
