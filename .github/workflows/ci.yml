name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-go-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.2.0
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - name: Verify templates
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: ./tests/verify-templates.sh
        working-directory: registry

  verify-rust-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.2.0
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify Rust templates
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: ./tests/verify-rust-templates.sh
        working-directory: registry

  verify-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.2.0
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - name: Generate Go fullstack app
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/fullstack \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind fullstack --backend go/gin-layered \
            --name "Fullstack CI" \
            --var module_path=example.com/fullstack \
            --var package_manager=pnpm \
            --no-input --no-git
      - name: Validate compose
        working-directory: /tmp/fullstack
        run: docker compose config
      - name: API tests
        working-directory: /tmp/fullstack/apps/api
        run: |
          go mod tidy
          go test ./...
      - name: Web install, typecheck, and tests
        working-directory: /tmp/fullstack/apps/web
        run: |
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test --runInBand
