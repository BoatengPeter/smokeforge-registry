name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-go-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - name: Verify templates
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: ./tests/verify-templates.sh
        working-directory: registry

  verify-rust-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SQLX_OFFLINE: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify Rust templates
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: ./tests/verify-rust-templates.sh
        working-directory: registry

  verify-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - name: Generate Go fullstack app
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/fullstack \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind fullstack --backend go/gin-layered \
            --name "Fullstack CI" \
            --var module_path=example.com/fullstack \
            --var package_manager=pnpm \
            --no-input --no-git
      - name: Validate compose and generated layout docs
        working-directory: /tmp/fullstack
        run: |
          docker compose config
          grep -q '## Code layout' README.md
          grep -q 'Code layout' CONTEXT-MAP.md
          grep -Eq '## (Code layout|Architecture)' apps/api/README.md
          grep -q '## Code layout' apps/web/README.md
      - name: API tests
        working-directory: /tmp/fullstack/apps/api
        run: |
          go mod tidy
          go test ./...
      - name: Web install, typecheck, and tests
        working-directory: /tmp/fullstack/apps/web
        run: |
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test --runInBand

  verify-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - name: Generate desktop app
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/desktop \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind desktop --stack desktop/electron \
            --name "Verify Desktop" --preset desktop \
            --feature testing:e2e --feature ci:github \
            --var bundle_id=com.example.desktopci \
            --var package_manager=pnpm \
            --var api_url=http://localhost:8080 \
            --no-input --no-git
      - name: Install desktop dependencies
        working-directory: /tmp/desktop
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Desktop quality gate
        working-directory: /tmp/desktop
        run: |
          make lint
          make typecheck
          make test
          make build
      - name: Desktop Playwright smoke
        working-directory: /tmp/desktop
        run: xvfb-run --auto-servernum -- make e2e
      - name: Generate fullstack desktop app
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/fullstack-desktop \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind fullstack --backend go/gin-layered --desktop electron \
            --feature state:zustand \
            --name "Verify Fullstack Desktop" --preset fullstack-api \
            --var module_path=example.com/fullstackdesktop \
            --var bundle_id=com.example.fullstackdesktop \
            --var package_manager=pnpm \
            --var api_url=http://localhost:8080 \
            --no-input --no-git
      - name: Verify fullstack desktop wiring
        working-directory: /tmp/fullstack-desktop
        run: |
          test -f docs/OFFLINE.md
          test -f apps/desktop/package.json
          grep -q 'desktop-dev' Makefile
          grep -q 'apps/desktop' CONTEXT-MAP.md
          cd apps/desktop
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          make lint typecheck test build
          cd ../api
          go mod tidy
          go test ./internal/library/...
      - name: Generate optional desktop features
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/desktop-optional \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind desktop --stack desktop/electron --preset desktop \
            --feature auth:oauth-pkce --feature shell:tray \
            --name "Verify Optional Desktop" \
            --var bundle_id=com.example.optionalci \
            --var package_manager=pnpm \
            --var api_url=http://localhost:8080 \
            --no-input --no-git
      - name: Optional desktop features build
        working-directory: /tmp/desktop-optional
        run: |
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          make typecheck
          make build


  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.1.0"
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - name: Verify Android templates
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: ./tests/verify-android.sh
        working-directory: registry

  verify-egui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate egui desktop app
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/egui-desktop \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind desktop --stack desktop/egui \
            --name "Verify Egui Desktop" --preset desktop-egui \
            --var crate_name=egui_desktop_ci \
            --var bundle_id=com.example.eguici \
            --var api_url=http://localhost:8080 \
            --no-input --no-git
      - name: Rust quality gate
        working-directory: /tmp/egui-desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  verify-gpui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      - uses: actions/checkout@v4
        with:
          repository: BoatengPeter/smokeforge
          ref: v0.3.7
          path: cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build smokeforge
        run: go build -o "$GITHUB_WORKSPACE/bin/smokeforge" ./cmd/smokeforge
        working-directory: cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
      - name: Generate GPUI desktop app
        env:
          SMOKEFORGE_BIN: ${{ github.workspace }}/bin/smokeforge
        run: |
          "$SMOKEFORGE_BIN" new /tmp/gpui-desktop \
            --registry "$GITHUB_WORKSPACE/registry" \
            --kind desktop --stack desktop/gpui \
            --name "Verify GPUI Desktop" --preset desktop-gpui \
            --var crate_name=gpui_desktop_ci \
            --var bundle_id=com.example.gpuici \
            --var api_url=http://localhost:8080 \
            --no-input --no-git
      - name: Verify pinned GPUI snapshot
        working-directory: /tmp/gpui-desktop
        run: |
          cargo generate-lockfile
          grep -A2 'name = "gpui-pre"' Cargo.lock | grep -q 'version = "0.3.12"'
      - name: Rust quality gate
        working-directory: /tmp/gpui-desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
