id: totp
name: TOTP two-factor authentication
files: files
ops:
  - addFiles:
      - {path: src/auth/totp.rs, dest: src/auth/totp.rs}
      - {path: migrations/0003_totp.sql, dest: migrations/0003_totp.sql}
      - {path: docs/TOTP.md, dest: docs/TOTP.md}
  - addDependency: {file: Cargo.toml, module: sha1, version: "0.11.0"}
  - insertAfter:
      file: src/auth/mod.rs
      anchor: auth-modules
      marker: totp-module
      content: 'pub mod totp;'
  - insertAfter:
      file: src/main.rs
      anchor: auth-second-factor
      marker: totp-second-factor
      content: |-
        let totp_service = std::sync::Arc::new(auth::totp::TotpService::new(database.pool().clone()));
        auth_service.set_second_factor(totp_service);
  - insertAfter:
      file: src/auth/routes.rs
      anchor: auth-openapi-extra
      marker: totp-openapi
      content: 'document.merge(super::totp::document());'
