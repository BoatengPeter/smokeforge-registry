services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      HTTP_PORT: "8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
