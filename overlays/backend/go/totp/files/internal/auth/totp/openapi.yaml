openapi: 3.0.3
info:
  title: TOTP
  version: 0.1.0
  description: TOTP enrollment, verification, and recovery codes.
tags:
  - name: totp
    description: Second-factor authentication.
paths:
  /api/v1/auth/totp/status:
    get:
      operationId: getTOTPStatus
      tags: [totp]
      summary: Read TOTP status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: TOTP status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPStatus'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/totp/setup:
    post:
      operationId: setupTOTP
      tags: [totp]
      summary: Begin TOTP enrollment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetup'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: TOTP is already enabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/totp/enable:
    post:
      operationId: enableTOTP
      tags: [totp]
      summary: Enable TOTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPCodeRequest'
      responses:
        '200':
          description: Recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPRecoveryCodes'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid code or enrollment state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/totp/disable:
    post:
      operationId: disableTOTP
      tags: [totp]
      summary: Disable TOTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPCodeRequest'
      responses:
        '204':
          description: TOTP disabled.
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TOTPStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    TOTPSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=6,max=20"
    TOTPRecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      description: RFC 9457 error response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
