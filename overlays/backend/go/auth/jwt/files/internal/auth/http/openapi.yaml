openapi: 3.0.3
info:
  title: Authentication
  version: 0.1.0
  description: JWT access tokens, rotating refresh sessions, and email auth flows.
tags:
  - name: auth
    description: Registration, login, refresh, and account recovery.
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '202':
          description: A second factor is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAChallenge'
        '401':
          description: Invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email verification is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login/totp:
    post:
      operationId: loginTOTP
      tags: [auth]
      summary: Complete a TOTP login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPVerifyRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired challenge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: TOTP is not enabled for this service.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate a refresh session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session revoked.
  /api/v1/auth/oauth/google:
    get:
      operationId: startGoogleOAuth
      tags: [auth]
      summary: Start Google OAuth
      responses:
        '302':
          description: Redirect to Google.
        '503':
          description: Google OAuth is not configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/oauth/google/callback:
    get:
      operationId: googleOAuthCallback
      tags: [auth]
      summary: Complete Google OAuth
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the configured success URL.
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          description: Invalid or expired token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted.
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          description: Invalid or expired token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, role, email_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            validate: "required,email"
        password:
          type: string
          minLength: 12
          maxLength: 256
          x-oapi-codegen-extra-tags:
            validate: "required,min=12,max=256"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            validate: "required,email"
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    TOTPVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge:
          type: string
        code:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=6,max=16"
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          x-oapi-codegen-extra-tags:
            validate: "required,email"
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        password:
          type: string
          minLength: 12
          maxLength: 256
          x-oapi-codegen-extra-tags:
            validate: "required,min=12,max=256"
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
    MFAChallenge:
      type: object
      required: [challenge, expires_in]
      properties:
        challenge:
          type: string
        expires_in:
          type: integer
          format: int64
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      description: RFC 9457 error response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
