services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MEDIA_MINIO_PORT:-9000}:9000"
      - "${MEDIA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - media-data:/data

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing local/media
        mc anonymous set none local/media
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    depends_on:
      - minio
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ALLOWED_BUCKETS: media
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_KEY:-minioadmin}
      IMGPROXY_KEY: ${MEDIA_IMGPROXY_KEY:-0123456789abcdef0123456789abcdef}
      IMGPROXY_SALT: ${MEDIA_IMGPROXY_SALT:-fedcba9876543210fedcba9876543210}
      IMGPROXY_LOG_LEVEL: warn
    depends_on:
      minio-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.28.2-alpine
    ports:
      - "${MEDIA_NGINX_PORT:-8081}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - imgproxy

  api:
    environment:
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT: http://localhost:${MEDIA_MINIO_PORT:-9000}
      MEDIA_IMGPROXY_BASE_URL: http://localhost:${MEDIA_NGINX_PORT:-8081}
      MEDIA_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  media-data:
