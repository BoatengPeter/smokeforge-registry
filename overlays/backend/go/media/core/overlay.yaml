id: media
name: Authenticated image media
files: files
ops:
  - addFiles:
      - {path: internal/database/migrator/migrations/00005_media.sql, dest: internal/database/migrator/migrations/00005_media.sql}
      - {path: internal/media/models.go, dest: internal/media/models.go}
      - {path: internal/media/ports.go, dest: internal/media/ports.go}
      - {path: internal/media/service.go.tmpl, dest: internal/media/service.go}
      - {path: internal/media/service_test.go.tmpl, dest: internal/media/service_test.go}
      - {path: internal/media/postgres/repository.go.tmpl, dest: internal/media/postgres/repository.go}
      - {path: internal/media/s3/store.go.tmpl, dest: internal/media/s3/store.go}
      - {path: internal/media/http/api_types.go.tmpl, dest: internal/media/http/api_types.go}
      - {path: internal/media/http/handler.go.tmpl, dest: internal/media/http/handler.go}
      - {path: internal/media/http/spec.go, dest: internal/media/http/spec.go}
      - {path: internal/media/http/handler_test.go.tmpl, dest: internal/media/http/handler_test.go}
      - {path: internal/media/http/openapi.yaml, dest: internal/media/http/openapi.yaml}
      - {path: internal/config/config_media.go.tmpl, dest: internal/config/config_media.go}
      - {path: internal/config/config_media_test.go.tmpl, dest: internal/config/config_media_test.go}
      - {path: docs/MEDIA.md, dest: docs/MEDIA.md}
  - addDependency: {file: go.mod, module: github.com/aws/aws-sdk-go-v2, version: v1.47.3}
  - addDependency: {file: go.mod, module: github.com/aws/aws-sdk-go-v2/credentials, version: v1.20.9}
  - addDependency: {file: go.mod, module: github.com/aws/aws-sdk-go-v2/service/s3, version: v1.114.3}
  - addDependency: {file: go.mod, module: github.com/aws/smithy-go, version: v1.28.5}
  - insertAfter:
      file: internal/config/config.go
      anchor: config-fields
      marker: media-config
      content: |-
        MediaS3Endpoint           string        `env:"MEDIA_S3_ENDPOINT" envDefault:"http://localhost:9000"`
        MediaS3PublicEndpoint     string        `env:"MEDIA_S3_PUBLIC_ENDPOINT" envDefault:"http://localhost:9000"`
        MediaS3Region             string        `env:"MEDIA_S3_REGION" envDefault:"us-east-1"`
        MediaS3Bucket             string        `env:"MEDIA_S3_BUCKET" envDefault:"media"`
        MediaS3AccessKey          string        `env:"MEDIA_S3_ACCESS_KEY" envDefault:"minioadmin"`
        MediaS3SecretKey          string        `env:"MEDIA_S3_SECRET_KEY" envDefault:"minioadmin"`
        MediaS3ForcePathStyle     bool          `env:"MEDIA_S3_FORCE_PATH_STYLE" envDefault:"true"`
        MediaMaxBytes             int64         `env:"MEDIA_MAX_BYTES" envDefault:"10485760"`
        MediaAllowedContentTypes  []string      `env:"MEDIA_ALLOWED_CONTENT_TYPES" envSeparator:"," envDefault:"image/jpeg,image/png,image/webp,image/gif"`
        MediaUploadURLTTL         time.Duration `env:"MEDIA_UPLOAD_URL_TTL" envDefault:"15m"`
        MediaDownloadURLTTL       time.Duration `env:"MEDIA_DOWNLOAD_URL_TTL" envDefault:"1h"`
  - insertAfter:
      file: internal/config/config_test.go
      anchor: config-test-fields
      marker: media-config-test
      content: |-
        MediaS3Endpoint:           "http://localhost:9000",
        MediaS3PublicEndpoint:     "http://localhost:9000",
        MediaS3Region:             "us-east-1",
        MediaS3Bucket:             "media",
        MediaS3AccessKey:          "minioadmin",
        MediaS3SecretKey:          "minioadmin",
        MediaS3ForcePathStyle:     true,
        MediaMaxBytes:             10 * 1024 * 1024,
        MediaAllowedContentTypes:  []string{"image/jpeg", "image/png", "image/webp", "image/gif"},
        MediaUploadURLTTL:         15 * time.Minute,
        MediaDownloadURLTTL:       time.Hour,
  - insertAfter:
      file: internal/config/config.go
      anchor: config-validation-body
      marker: media-validation
      content: |-
        if err := c.validateMedia(); err != nil {
        	return err
        }
  - insertAfter:
      file: cmd/api/main.go
      anchor: import-media
      marker: media-import
      content: |
        media "{{.module_path}}/internal/media"
        mediahttp "{{.module_path}}/internal/media/http"
        mediapostgres "{{.module_path}}/internal/media/postgres"
        medias3 "{{.module_path}}/internal/media/s3"
        // smokeforge:anchor import-media-provider
  - insertAfter:
      file: cmd/api/main.go
      anchor: main-media
      marker: media-main
      content: |-
        mediaObjects, err := medias3.New(cfg)
        if err != nil {
        	return fmt.Errorf("configure media storage: %w", err)
        }

        mediaService := media.NewService(
        	mediapostgres.NewRepository(db.Pool()),
        	mediaObjects,
        	cfg,
        	logger,
        )
        // smokeforge:anchor media-provider

        mediaHandler := mediahttp.NewHandler(mediaService, authService, logger)
  - insertAfter:
      file: cmd/api/main.go
      anchor: http-options
      marker: media-http
      content: 'httpapi.WithRegistrar(mediaHandler),'
  - env: {key: MEDIA_S3_ENDPOINT, example: "http://localhost:9000"}
  - env: {key: MEDIA_S3_PUBLIC_ENDPOINT, example: "http://localhost:9000"}
  - env: {key: MEDIA_S3_REGION, example: us-east-1}
  - env: {key: MEDIA_S3_BUCKET, example: media}
  - env: {key: MEDIA_S3_ACCESS_KEY, example: minioadmin}
  - env: {key: MEDIA_S3_SECRET_KEY, example: minioadmin, secret: true}
  - env: {key: MEDIA_S3_FORCE_PATH_STYLE, example: "true"}
  - env: {key: MEDIA_MAX_BYTES, example: "10485760"}
  - env: {key: MEDIA_ALLOWED_CONTENT_TYPES, example: "image/jpeg,image/png,image/webp,image/gif"}
  - env: {key: MEDIA_UPLOAD_URL_TTL, example: 15m}
  - env: {key: MEDIA_DOWNLOAD_URL_TTL, example: 1h}
