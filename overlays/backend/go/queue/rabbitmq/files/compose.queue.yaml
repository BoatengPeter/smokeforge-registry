services:
  rabbitmq:
    image: rabbitmq:4.1-management
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: smokeforge
      RABBITMQ_DEFAULT_PASS: smokeforge
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rabbitmq-data:
