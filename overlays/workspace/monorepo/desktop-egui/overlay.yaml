id: workspace-desktop-egui
name: Workspace egui wiring
ops:
  - insertAfter:
      file: Makefile
      anchor: workspace-phony
      marker: workspace:egui-phony
      content: ".PHONY: desktop-dev desktop-test desktop-build desktop-package desktop-ci"
  - insertAfter:
      file: Makefile
      anchor: workspace-help
      marker: workspace:egui-help
      content: |-
        @echo "make desktop-dev      Run egui with cargo-watch"
        @echo "make desktop-test     Run desktop checks"
        @echo "make desktop-build    Build the desktop app"
        @echo "make desktop-package  Package the desktop app"
  - insertAfter:
      file: Makefile
      anchor: workspace-targets
      marker: workspace:egui-targets
      content: |-
        desktop-dev:
        	$(MAKE) -C apps/desktop dev

        desktop-test:
        	$(MAKE) -C apps/desktop test

        desktop-build:
        	$(MAKE) -C apps/desktop build

        desktop-package:
        	$(MAKE) -C apps/desktop package

        desktop-ci:
        	$(MAKE) -C apps/desktop check test
  - insertAfter:
      file: Makefile
      anchor: workspace-install
      marker: workspace:egui-install
      content: "\t$(MAKE) -C apps/desktop install"
  - insertAfter:
      file: Makefile
      anchor: workspace-test
      marker: workspace:egui-test
      content: "\t$(MAKE) desktop-test"
  - insertAfter:
      file: Makefile
      anchor: workspace-ci
      marker: workspace:egui-ci
      content: "\t$(MAKE) desktop-ci"
  - insertAfter:
      file: Makefile
      anchor: workspace-clean
      marker: workspace:egui-clean
      content: "\t$(MAKE) -C apps/desktop clean"
  - insertAfter:
      file: README.md
      anchor: workspace-clients
      marker: workspace:egui-readme
      content: |-
        ### Desktop

        Native egui desktop app. Run `make -C apps/desktop dev-tools` once before
        using the watch-based dev loop.

        ```bash
        make desktop-dev
        make desktop-test
        make desktop-build
        make desktop-package
        ```

        Read [`apps/desktop/AGENTS.md`](apps/desktop/AGENTS.md) and
        [`apps/desktop/CONTEXT.md`](apps/desktop/CONTEXT.md) before changing it.
  - insertAfter:
      file: CONTEXT-MAP.md
      anchor: workspace-context-map
      marker: workspace:egui-context-map
      content: "| Desktop | [`apps/desktop/CONTEXT.md`](apps/desktop/CONTEXT.md) | Native desktop, local data, API/sync |"
  - insertAfter:
      file: CONTEXT.md
      anchor: workspace-context
      marker: workspace:egui-context
      content: |-
        ### Desktop

        The native desktop app keeps API tokens in the platform keyring and local
        data in its storage layer.
  - insertAfter:
      file: AGENTS.md
      anchor: workspace-agents
      marker: workspace:egui-agents
      content: "- Desktop: `apps/desktop/AGENTS.md`, `apps/desktop/CONTEXT.md`, and `apps/desktop/.agents/skills/`."
  - insertAfter:
      file: CLAUDE.md
      anchor: workspace-claude
      marker: workspace:egui-claude
      content: "- Desktop: `apps/desktop/AGENTS.md`, `apps/desktop/CONTEXT.md`, and `apps/desktop/.claude/skills/`."
  - insertAfter:
      file: docs/CLIENTS.md
      anchor: workspace-doc-clients
      marker: workspace:egui-doc
      content: "- Desktop: [`apps/desktop/CONTEXT.md`](../apps/desktop/CONTEXT.md)"
  - insertAfter:
      file: docs/SKILLS.md
      anchor: workspace-skills
      marker: workspace:egui-skills
      content: "- Desktop: `apps/desktop/.agents/skills/` and `apps/desktop/.claude/skills/`"
