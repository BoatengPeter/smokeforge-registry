id: desktop-egui
name: Fullstack egui desktop wiring
files: files
ops:
  - insertAfter:
      file: Makefile
      anchor: desktop-phony
      marker: desktop:egui-phony
      content: |
        .PHONY: desktop-dev desktop-run desktop-check desktop-test desktop-build desktop-package
  - insertAfter:
      file: Makefile
      anchor: desktop-help
      marker: desktop:egui-help
      content: |
        @echo "make desktop-dev     Run the egui app with cargo-watch rebuild + restart"
        @echo "make desktop-run     Run the egui app once"
        @echo "make desktop-check   Cargo check the egui workspace"
        @echo "make desktop-test    Run egui workspace tests"
        @echo "make desktop-build   Build the egui workspace"
        @echo "make desktop-package Package the egui app"
  - insertAfter:
      file: Makefile
      anchor: desktop-targets
      marker: desktop:egui-targets
      content: |-
        desktop-dev:
        	$(MAKE) -C apps/desktop dev

        desktop-run:
        	$(MAKE) -C apps/desktop run

        desktop-check:
        	$(MAKE) -C apps/desktop check

        desktop-test:
        	$(MAKE) -C apps/desktop test

        desktop-build:
        	$(MAKE) -C apps/desktop build

        desktop-package:
        	$(MAKE) -C apps/desktop package
  - insertAfter:
      file: Makefile
      anchor: desktop-install
      marker: desktop:egui-install
      content: "\t$(MAKE) -C apps/desktop install"
  - insertAfter:
      file: Makefile
      anchor: desktop-test
      marker: desktop:egui-test
      content: "\t$(MAKE) -C apps/desktop test"
  - insertAfter:
      file: Makefile
      anchor: desktop-ci
      marker: desktop:egui-ci
      content: "\t$(MAKE) -C apps/desktop check"
  - insertAfter:
      file: Makefile
      anchor: desktop-clean
      marker: desktop:egui-clean
      content: "\t$(MAKE) -C apps/desktop clean"
  - insertAfter:
      file: README.md
      anchor: desktop-readme
      marker: desktop:egui-readme
      content: |-
        ## Desktop client

        When generated with `--desktop egui`, the workspace also contains
        `apps/desktop`: a native Rust eframe application with a local SQLite
        Library, project-scoped Rust skills, and an API-backed mode reserved for
        the API-client milestone.

        ```bash
        make desktop-dev     # cargo-watch; run `make -C apps/desktop dev-tools` once
        make desktop-test
        make desktop-build
        ```

        The native app never exposes credentials to a renderer and owns its
        local database, settings, and keyring access. See
        [`apps/desktop/CONTEXT.md`](apps/desktop/CONTEXT.md) and
        [`apps/desktop/docs/UI.md`](apps/desktop/docs/UI.md).
  - insertAfter:
      file: CONTEXT-MAP.md
      anchor: desktop-context
      marker: desktop:egui-context
      content: |-
        ## Native egui target

        When `apps/desktop` is generated with `--desktop egui`:

        - UI/app: `apps/desktop/crates/app`
        - Domain: `apps/desktop/crates/core`
        - Local data: `apps/desktop/crates/storage` with `rusqlite`
        - API client: `apps/desktop/crates/api-client`
        - Entry point: `apps/desktop/crates/desktop`

        The API remains the source of truth. The egui app is local-first now;
        generated API authentication and offline sync are added by the dedicated
        egui milestones. Do not copy the Electron IPC/session model into it.
