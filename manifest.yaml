schemaVersion: 1
name: smokeforge-registry
kinds:
  backend:
    max: 1
  frontend:
    max: 1
  fullstack:
    max: 1
  desktop:
    max: 1
stacks:
  - id: go/gin-flat
    kind: backend
    name: Go (Gin, flat)
    template: templates/backend/go/gin-flat
    variables: [module_path, http_port]
  - id: go/gin-layered
    kind: backend
    name: Go (Gin, layered)
    template: templates/backend/go/gin-layered
    variables: [module_path, http_port]
  - id: go/gin-hexagonal
    kind: backend
    name: Go (Gin, hexagonal)
    template: templates/backend/go/gin-hexagonal
    variables: [module_path, http_port]
  - id: go/gin-ddd
    kind: backend
    name: Go (Gin, DDD)
    template: templates/backend/go/gin-ddd
    variables: [module_path, http_port]
  - id: rust/axum
    kind: backend
    name: Rust (axum)
    template: templates/backend/rust/axum
    variables: [crate_name, http_port]
  - id: next
    kind: frontend
    name: Next.js
    template: templates/frontend/next
    variables: [package_manager, site_description]
  - id: workspace/fullstack
    kind: fullstack
    name: Fullstack workspace
    template: templates/workspace/fullstack
    variables: [package_manager]
  - id: desktop/electron
    kind: desktop
    name: Electron
    template: templates/desktop/electron
    variables: [bundle_id, package_manager, api_url]
presets:
  - id: fullstack
    name: Fullstack SaaS
    description: Postgres, Better Auth, and Zustand
    kinds: [frontend]
    default: true
    features: [database:postgres, auth:session, state:zustand, data:tanstack-query]
  - id: frontend
    name: Frontend only
    description: The base app without backend or client state
    kinds: [frontend]
    features: []
  - id: desktop
    name: Desktop app
    description: Secure Electron + React desktop app with TanStack Query, Zustand, and SQLite
    kinds: [desktop]
    default: true
    features: [data:tanstack-query, state:zustand, storage:sqlite]
  - id: api
    name: Backend API
    description: Postgres and JWT authentication for any backend stack
    kinds: [backend]
    default: true
    features: [database:postgres, auth:jwt]
  - id: api-custom
    name: Custom backend API
    description: Choose database, cache, queue, scheduler, dedupe, compression, auth, TOTP, media, search, search sync, pagination, Docker, and CI
    kinds: [backend]
    features: []
  - id: fullstack-api
    name: Fullstack API + Next.js
    description: Go or Rust API with Postgres/JWT, a Next.js BFF frontend, TanStack Query, Docker, and CI
    kinds: [fullstack]
    default: true
    features: [database:postgres, auth:jwt, data:tanstack-query, docker, ci:github]
features:
  - id: docker
    name: Docker
    kinds: [backend, frontend, fullstack]
    overlays:
      go/gin-flat: overlays/backend/go/docker
      go/gin-layered: overlays/backend/go/docker
      go/gin-hexagonal: overlays/backend/go/docker
      go/gin-ddd: overlays/backend/go/docker
      rust/axum: overlays/backend/rust/docker
      next: overlays/next/docker
      workspace/fullstack: overlays/workspace/fullstack/docker
  - id: ci
    name: CI
    kinds: [backend, frontend, fullstack, desktop]
    variants:
      - id: github
        name: GitHub Actions
        default: true
        overlays:
          go/gin-flat: overlays/backend/go/ci/github
          go/gin-layered: overlays/backend/go/ci/github
          go/gin-hexagonal: overlays/backend/go/ci/github
          go/gin-ddd: overlays/backend/go/ci/github
          rust/axum: overlays/backend/rust/ci/github
          next: overlays/next/ci/github
          workspace/fullstack: overlays/workspace/fullstack/ci
          desktop/electron: overlays/desktop/electron/ci/github
  - id: database
    name: Database
    kinds: [backend, frontend]
    variants:
      - id: postgres
        name: PostgreSQL
        default: true
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
          - next
        overlays:
          go/gin-flat: overlays/backend/go/database/postgres
          go/gin-layered: overlays/backend/go/database/postgres
          go/gin-hexagonal: overlays/backend/go/database/postgres
          go/gin-ddd: overlays/backend/go/database/postgres
          rust/axum: overlays/backend/rust/database/postgres
          next: overlays/next/database/postgres
  - id: cache
    name: Cache
    kinds: [backend]
    variants:
      - id: redis
        name: Redis
        default: true
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/cache/redis
          go/gin-layered: overlays/backend/go/cache/redis
          go/gin-hexagonal: overlays/backend/go/cache/redis
          go/gin-ddd: overlays/backend/go/cache/redis
          rust/axum: overlays/backend/rust/cache/redis

  - id: state
    name: Client state
    kinds: [frontend, desktop]
    variants:
      - id: zustand
        name: Zustand
        default: true
        stacks: [next, desktop/electron]
        overlays:
          next: overlays/next/state/zustand
          desktop/electron: overlays/desktop/electron/state/zustand
  - id: testing
    name: End-to-end testing
    kinds: [frontend, desktop]
    variants:
      - id: e2e
        name: Playwright
        default: true
        stacks: [next, desktop/electron]
        overlays:
          next: overlays/next/testing/e2e
          desktop/electron: overlays/desktop/electron/testing/e2e
  - id: analytics
    name: Analytics
    kinds: [frontend]
    variants:
      - id: posthog
        name: PostHog
        default: true
        overlays:
          next: overlays/next/analytics/posthog

  - id: storage
    name: Local storage
    kinds: [desktop]
    variants:
      - id: sqlite
        name: SQLite
        default: true
        stacks: [desktop/electron]
        overlays:
          desktop/electron: overlays/desktop/electron/storage/sqlite
  - id: data
    name: Data fetching
    kinds: [frontend, desktop]
    variants:
      - id: tanstack-query
        name: TanStack Query
        default: true
        stacks: [next, desktop/electron]
        overlays:
          next: overlays/next/data/tanstack-query
          desktop/electron: overlays/desktop/electron/data/tanstack-query
  - id: queue
    name: Queue
    kinds: [backend]
    variants:
      - id: rabbitmq
        name: RabbitMQ
        default: true
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/queue/rabbitmq
          go/gin-layered: overlays/backend/go/queue/rabbitmq
          go/gin-hexagonal: overlays/backend/go/queue/rabbitmq
          go/gin-ddd: overlays/backend/go/queue/rabbitmq
          rust/axum: overlays/backend/rust/queue/rabbitmq

  - id: scheduler
    name: Scheduler
    kinds: [backend]
    variants:
      - id: leader
        name: Redis leader election
        requires: [queue:rabbitmq, cache:redis]
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/scheduler/leader
          go/gin-layered: overlays/backend/go/scheduler/leader
          go/gin-hexagonal: overlays/backend/go/scheduler/leader
          go/gin-ddd: overlays/backend/go/scheduler/leader
          rust/axum: overlays/backend/rust/scheduler/leader

  - id: dedupe
    name: Job deduplication
    kinds: [backend]
    variants:
      - id: redis
        name: Redis markers
        requires: [queue:rabbitmq, cache:redis]
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/dedupe/redis
          go/gin-layered: overlays/backend/go/dedupe/redis
          go/gin-hexagonal: overlays/backend/go/dedupe/redis
          go/gin-ddd: overlays/backend/go/dedupe/redis
          rust/axum: overlays/backend/rust/dedupe/redis

  - id: compression
    name: Queue compression
    kinds: [backend]
    variants:
      - id: gzip
        name: Gzip
        requires: [queue:rabbitmq]
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/compression/gzip
          go/gin-layered: overlays/backend/go/compression/gzip
          go/gin-hexagonal: overlays/backend/go/compression/gzip
          go/gin-ddd: overlays/backend/go/compression/gzip
          rust/axum: overlays/backend/rust/compression/gzip

  - id: auth
    name: Authentication
    kinds: [backend, frontend]
    variants:
      - id: session
        name: Email + OTP sessions
        default: true
        stacks: [next]
        requires: [database:postgres]
        overlays:
          next: overlays/next/auth/session
      - id: jwt
        name: JWT access + rotating refresh
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        requires: [database:postgres]
        overlays:
          go/gin-flat: overlays/backend/go/auth/jwt
          go/gin-layered: overlays/backend/go/auth/jwt
          go/gin-hexagonal: overlays/backend/go/auth/jwt
          go/gin-ddd: overlays/backend/go/auth/jwt
          rust/axum: overlays/backend/rust/auth/jwt
      - id: bff
        name: Next.js BFF for API JWT
        stacks: [next]
        requires: [data:tanstack-query]
        overlays:
          next: overlays/next/auth/bff
  - id: totp
    name: TOTP two-factor authentication
    kinds: [backend]
    stacks:
      - go/gin-flat
      - go/gin-layered
      - go/gin-hexagonal
      - go/gin-ddd
      - rust/axum
    requires: [auth:jwt]
    overlays:
      go/gin-flat: overlays/backend/go/totp
      go/gin-layered: overlays/backend/go/totp
      go/gin-hexagonal: overlays/backend/go/totp
      go/gin-ddd: overlays/backend/go/totp
      rust/axum: overlays/backend/rust/totp

  - id: media
    name: Image media
    kinds: [backend]
    requires: [database:postgres, auth:jwt]
    stacks:
      - go/gin-flat
      - go/gin-layered
      - go/gin-hexagonal
      - go/gin-ddd
      - rust/axum
    overlays:
      go/gin-flat: overlays/backend/go/media/core
      go/gin-layered: overlays/backend/go/media/core
      go/gin-hexagonal: overlays/backend/go/media/core
      go/gin-ddd: overlays/backend/go/media/core
      rust/axum: overlays/backend/rust/media/core

  - id: media-provider
    name: Media provider
    kinds: [backend]
    requires: [media]
    variants:
      - id: minio
        name: MinIO + imgproxy + nginx
        default: true
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/media/minio
          go/gin-layered: overlays/backend/go/media/minio
          go/gin-hexagonal: overlays/backend/go/media/minio
          go/gin-ddd: overlays/backend/go/media/minio
          rust/axum: overlays/backend/rust/media/minio
      - id: r2
        name: Cloudflare R2
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/media/r2
          go/gin-layered: overlays/backend/go/media/r2
          go/gin-hexagonal: overlays/backend/go/media/r2
          go/gin-ddd: overlays/backend/go/media/r2
          rust/axum: overlays/backend/rust/media/r2

  - id: search
    name: Search
    kinds: [backend]
    variants:
      - id: meilisearch
        name: Meilisearch
        default: true
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/search/meilisearch
          go/gin-layered: overlays/backend/go/search/meilisearch
          go/gin-hexagonal: overlays/backend/go/search/meilisearch
          go/gin-ddd: overlays/backend/go/search/meilisearch
          rust/axum: overlays/backend/rust/search/meilisearch

  - id: search-sync
    name: Search index sync
    kinds: [backend]
    variants:
      - id: rabbitmq
        name: RabbitMQ
        default: true
        requires: [search:meilisearch, queue:rabbitmq]
        stacks:
          - go/gin-flat
          - go/gin-layered
          - go/gin-hexagonal
          - go/gin-ddd
          - rust/axum
        overlays:
          go/gin-flat: overlays/backend/go/search/sync/rabbitmq
          go/gin-layered: overlays/backend/go/search/sync/rabbitmq
          go/gin-hexagonal: overlays/backend/go/search/sync/rabbitmq
          go/gin-ddd: overlays/backend/go/search/sync/rabbitmq
          rust/axum: overlays/backend/rust/search/sync/rabbitmq

  - id: pagination
    name: Pagination
    kinds: [backend]
    stacks:
      - go/gin-flat
      - go/gin-layered
      - go/gin-hexagonal
      - go/gin-ddd
      - rust/axum
    overlays:
      go/gin-flat: overlays/backend/go/pagination
      go/gin-layered: overlays/backend/go/pagination
      go/gin-hexagonal: overlays/backend/go/pagination
      go/gin-ddd: overlays/backend/go/pagination
      rust/axum: overlays/backend/rust/pagination
